name: Build Cross-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. STANDARD RUNNERS: macOS (.dmg), Windows (.exe), Debian/Ubuntu (.deb)
  # =========================================================================
  build-standard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            icon_flag: '--icon=src/rudechat4/Resources/Icons/rude.icns'
          - os: windows-latest
            platform: windows
            icon_flag: '--icon=src/rudechat4/Resources/Icons/rude.ico'
          - os: ubuntu-latest
            platform: debian-ubuntu
            icon_flag: '--icon=src/rudechat4/Resources/Icons/rude_icon_round.png'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux system dependencies (PyQt6 & Audio)
        if: matrix.platform == 'debian-ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libasound2-dev

      - name: Install Python dependencies & rudechat4 package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install .

      - name: Bundle app with PyInstaller
        run: |
          python -c "import pathlib; pathlib.Path('ci_entry.py').write_text('import runpy\nrunpy.run_module(chr(114)+chr(117)+chr(100)+chr(101)+chr(99)+chr(104)+chr(97)+chr(116)+chr(52), run_name=chr(95)*2+chr(109)+chr(97)+chr(105)+chr(110)+chr(95)*2)\n')"
          python -m PyInstaller --noconfirm --windowed --name "rudechat" --paths=src --collect-submodules=rudechat4 ${{ matrix.icon_flag }} "--add-data=src/rudechat4/Resources:rudechat4/Resources" "--add-data=src/rudechat4/DefaultConfig:rudechat4/DefaultConfig" ci_entry.py

      # ---------------- MACOS (.dmg) ----------------
      - name: Package macOS .dmg
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release
          hdiutil create -volname "rudechat" -srcfolder "dist/rudechat.app" -ov -format UDZO "release/rudechat-macOS.dmg"

      # ---------------- WINDOWS (.exe installer) ----------------
      - name: Package Windows .exe Installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          mkdir release
          @"
          [Setup]
          AppName=rudechat
          AppVersion=1.0.0
          DefaultDirName={autopf}\rudechat
          DefaultGroupName=rudechat
          SetupIconFile=src\rudechat4\Resources\Icons\rude.ico
          OutputDir=release
          OutputBaseFilename=rudechat-Windows-Setup
          Compression=lzma2
          SolidCompression=yes

          [Files]
          Source: "dist\rudechat\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\rudechat"; Filename: "{app}\rudechat.exe"; IconFilename: "{app}\_internal\rudechat4\Resources\Icons\rude.ico"
          Name: "{autodesktop}\rudechat"; Filename: "{app}\rudechat.exe"; IconFilename: "{app}\_internal\rudechat4\Resources\Icons\rude.ico"
          "@ | Out-File -FilePath installer.iss -Encoding utf8
          iscc installer.iss

      # ---------------- LINUX (.deb) ----------------
      - name: Package Linux .deb
        if: matrix.platform == 'debian-ubuntu'
        run: |
          mkdir -p release pkg/usr/local/bin pkg/opt/rudechat pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps pkg/DEBIAN
          cp -r dist/rudechat/* pkg/opt/rudechat/
          cp src/rudechat4/Resources/Icons/rude_icon_round.png pkg/usr/share/icons/hicolor/256x256/apps/rudechat.png
          ln -s /opt/rudechat/rudechat pkg/usr/local/bin/rudechat

          cat <<EOF > pkg/usr/share/applications/rudechat.desktop
          [Desktop Entry]
          Name=rudechat
          Exec=/usr/local/bin/rudechat
          Icon=rudechat
          Type=Application
          Categories=Utility;
          EOF

          cat <<EOF > pkg/DEBIAN/control
          Package: rudechat
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Your Name <you@example.com>
          Description: rudechat PyQt6 Application
          EOF
          dpkg-deb --build pkg release/rudechat-Linux-amd64.deb

      - name: Upload Installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release/*

  # =========================================================================
  # 2. FEDORA / RHEL (.rpm) via Official Fedora Container
  # =========================================================================
  build-fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Fedora build tools & Python
        run: |
          dnf install -y python3 python3-pip python3-devel rpm-build binutils mesa-libEGL libxkbcommon-x11 xcb-util-cursor dbus-libs alsa-lib-devel git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt pyinstaller
          pip3 install .
          python3 -c "import pathlib; pathlib.Path('ci_entry.py').write_text('import runpy\nrunpy.run_module(chr(114)+chr(117)+chr(100)+chr(101)+chr(99)+chr(104)+chr(97)+chr(116)+chr(52), run_name=chr(95)*2+chr(109)+chr(97)+chr(105)+chr(110)+chr(95)*2)\n')"
          python3 -m PyInstaller --noconfirm --windowed --name "rudechat" --paths=src --collect-submodules=rudechat4 --icon=src/rudechat4/Resources/Icons/rude_icon_round.png "--add-data=src/rudechat4/Resources:rudechat4/Resources" "--add-data=src/rudechat4/DefaultConfig:rudechat4/DefaultConfig" ci_entry.py

      - name: Package .rpm
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} release
          tar -czf ~/rpmbuild/SOURCES/rudechat-1.0.0.tar.gz -C dist rudechat
          cp src/rudechat4/Resources/Icons/rude_icon_round.png ~/rpmbuild/SOURCES/rudechat.png

          cat <<EOF > ~/rpmbuild/SPECS/rudechat.spec
          %global _build_id_links none
          %global __strip /bin/true
          %global debug_package %{nil}
          Name:           rudechat
          Version:        1.0.0
          Release:        1%{?dist}
          Summary:        rudechat PyQt6 Application
          License:        GPLv3
          Source0:        rudechat-1.0.0.tar.gz
          Source1:        rudechat.png

          %description
          rudechat PyQt6 Application

          %prep
          %setup -q -n rudechat

          %install
          mkdir -p %{buildroot}/opt/rudechat
          mkdir -p %{buildroot}/usr/local/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp -r * %{buildroot}/opt/rudechat/
          ln -s /opt/rudechat/rudechat %{buildroot}/usr/local/bin/rudechat
          cp %{SOURCE1} %{buildroot}/usr/share/icons/hicolor/256x256/apps/rudechat.png

          cat <<DESKTOP > %{buildroot}/usr/share/applications/rudechat.desktop
          [Desktop Entry]
          Name=rudechat
          Exec=/usr/local/bin/rudechat
          Icon=rudechat
          Type=Application
          Categories=Utility;
          DESKTOP

          %files
          /opt/rudechat
          /usr/local/bin/rudechat
          /usr/share/applications/rudechat.desktop
          /usr/share/icons/hicolor/256x256/apps/rudechat.png
          EOF

          rpmbuild -bb ~/rpmbuild/SPECS/rudechat.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm release/rudechat-Fedora-x86_64.rpm

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: installer-fedora-rpm
          path: release/*.rpm

  # =========================================================================
  # 3. ARCH LINUX (.pkg.tar.zst) via Official Arch Container
  # =========================================================================
  build-arch-pkg:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch build tools & Python
        run: |
          pacman -Syu --noconfirm base-devel python python-pip binutils libglvnd libxkbcommon-x11 xcb-util-cursor dbus alsa-lib git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with PyInstaller
        run: |
          python -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r requirements.txt pyinstaller
          /opt/venv/bin/pip install .
          /opt/venv/bin/python -c "import pathlib; pathlib.Path('ci_entry.py').write_text('import runpy\nrunpy.run_module(chr(114)+chr(117)+chr(100)+chr(101)+chr(99)+chr(104)+chr(97)+chr(116)+chr(52), run_name=chr(95)*2+chr(109)+chr(97)+chr(105)+chr(110)+chr(95)*2)\n')"
          /opt/venv/bin/python -m PyInstaller --noconfirm --windowed --name "rudechat" --paths=src --collect-submodules=rudechat4 --icon=src/rudechat4/Resources/Icons/rude_icon_round.png "--add-data=src/rudechat4/Resources:rudechat4/Resources" "--add-data=src/rudechat4/DefaultConfig:rudechat4/DefaultConfig" ci_entry.py

      - name: Package Arch .pkg.tar.zst
        run: |
          useradd -m builder
          mkdir -p /home/builder/pkg release
          cp -r dist/rudechat /home/builder/pkg/
          cp src/rudechat4/Resources/Icons/rude_icon_round.png /home/builder/pkg/rudechat.png

          cat <<EOF > /home/builder/pkg/PKGBUILD
          pkgname=rudechat
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="rudechat PyQt6 Application"
          arch=('x86_64')
          license=('GPL3')
          options=('!strip')

          package() {
              install -dm755 "\$pkgdir/opt/rudechat"
              install -dm755 "\$pkgdir/usr/local/bin"
              install -dm755 "\$pkgdir/usr/share/applications"
              install -dm755 "\$pkgdir/usr/share/icons/hicolor/256x256/apps"

              cp -r "\$startdir/rudechat/"* "\$pkgdir/opt/rudechat/"
              ln -s /opt/rudechat/rudechat "\$pkgdir/usr/local/bin/rudechat"
              install -Dm644 "\$startdir/rudechat.png" "\$pkgdir/usr/share/icons/hicolor/256x256/apps/rudechat.png"

              cat <<DESKTOP > "\$pkgdir/usr/share/applications/rudechat.desktop"
          [Desktop Entry]
          Name=rudechat
          Exec=/usr/local/bin/rudechat
          Icon=rudechat
          Type=Application
          Categories=Utility;
          DESKTOP
          }
          EOF

          chown -R builder:builder /home/builder
          su builder -c "cd /home/builder/pkg && makepkg -f"
          cp /home/builder/pkg/*.pkg.tar.zst release/rudechat-Arch-x86_64.pkg.tar.zst

      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: installer-arch-pkg
          path: release/*.pkg.tar.zst

  # =========================================================================
  # 4. MUSL LINUX (Alpine .tar.gz) via Official Alpine Container
  # =========================================================================
  build-musl-alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Install musl/Alpine build tools & native PyQt6
        run: |
          apk add --no-cache python3 py3-pip py3-qt6 py3-requests py3-tzlocal py3-regex py3-aiofiles binutils gcc musl-dev python3-dev zlib-dev git bash

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build musl binary with PyInstaller
        run: |
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install irctokens emoji pyinstaller pytz
          /opt/venv/bin/pip install --no-deps .
          /opt/venv/bin/python -c "import pathlib; pathlib.Path('ci_entry.py').write_text('import runpy\nrunpy.run_module(chr(114)+chr(117)+chr(100)+chr(101)+chr(99)+chr(104)+chr(97)+chr(116)+chr(52), run_name=chr(95)*2+chr(109)+chr(97)+chr(105)+chr(110)+chr(95)*2)\n')"
          /opt/venv/bin/python -m PyInstaller --noconfirm --windowed --name "rudechat" --paths=src --collect-submodules=rudechat4 --icon=src/rudechat4/Resources/Icons/rude_icon_round.png "--add-data=src/rudechat4/Resources:rudechat4/Resources" "--add-data=src/rudechat4/DefaultConfig:rudechat4/DefaultConfig" ci_entry.py

      - name: Package musl tarball
        run: |
          mkdir -p release
          tar -czf release/rudechat-Linux-musl-x86_64.tar.gz -C dist rudechat

      - name: Upload musl Archive
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-musl
          path: release/*.tar.gz