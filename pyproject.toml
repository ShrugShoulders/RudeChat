[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RudeChat"
version = "4.2.0"
description = "Python IRC client designed to be fast, portable, and fun."
authors = [
    { name = "Irish" },
    { name = "Bash Elliott", email = "rackodo.business@gmail.com" },
]
license = "GPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytz",
    "regex",
    "irctokens",
    "aiofiles",
    "tzlocal",
    "emoji",
    "PyQt6",
    "requests",
]

[project.urls]
homepage = "https://github.com/ShrugShoulders/RudeChat"

[project.scripts]
rudechat = "rudechat4.__main__:__main__"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*"]